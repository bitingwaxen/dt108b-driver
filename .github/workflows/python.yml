name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m compileall src cups
      - run: python -m unittest discover -s tests
      - run: bash -n install.sh uninstall.sh remove_everything.sh cups/dt108b scripts/*.sh
