[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dt108b-linux"
version = "0.1.0"
description = "Linux CUPS/AirPrint bridge for the MHT DT108B label printer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dt108b-print = "dt108b.cli:print_main"
dt108b-calibrate = "dt108b.cli:calibrate_main"
dt108b-worker = "dt108b.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
